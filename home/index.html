<script>
    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       ADD YOUR IMAGES HERE
       Each entry: "path/to/image.jpg"
       or a full URL. Leave "" for
       a placeholder.
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    const images = [
        "/images/FoodCreatures/cafe-interior-conceptart.webp",
        "/images/FoodCreatures/key_art_2 copy.webp",
        "/images/ConceptArtA03/keyart_01_full.webp",
        "/images/ConceptArtA03/keyart_02_full.webp",
        "/images/ROAM/dino_roam_keyart_01.webp",
    ];

    /* tilt per slot — alternates so each card feels unique */
    const tilts = [-4, 3, -2, 5, -3, 4, -5, 2, -3, 4];

    const total = images.length;
    let cur = 0;
    let animating = false;

    const stage = document.getElementById('gcStage');
    const prevBtn = document.getElementById('gcPrev');
    const nextBtn = document.getElementById('gcNext');
    const countEl = document.getElementById('gcCount');
    const dotsWrap = document.getElementById('gcDots');

    /* build one card per image */
    const cards = images.map((src, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = src
            ? `<img src="${src}" alt="Gallery image ${i + 1}">`
            : `<div class="img-placeholder"><i class="ti ti-photo"></i><span>Your image here</span></div>`;
        card.addEventListener('click', () => { if (i !== cur) goTo(i > cur ? cur + 1 : cur - 1); });
        stage.appendChild(card);
        return card;
    });

    /* dot per image */
    images.forEach((_, i) => {
        const d = document.createElement('button');
        d.className = 'dot';
        d.setAttribute('aria-label', 'Slide ' + (i + 1));
        d.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(d);
    });

    /* slot definitions — how many cards visible each side */
    const SLOTS = [-2, -1, 0, 1, 2];
    const slotCfg = {
        '-2': { x: -0.40, s: 0.54, z: 1, o: 0.35 },
        '-1': { x: -0.21, s: 0.72, z: 3, o: 0.65 },
        '0': { x: 0, s: 1.00, z: 5, o: 1.00 },
        '1': { x: 0.21, s: 0.72, z: 3, o: 0.65 },
        '2': { x: 0.40, s: 0.54, z: 1, o: 0.35 },
    };

    /* wrap index for infinite loop */
    function wrap(n) { return ((n % total) + total) % total; }

    function layout() {
        const w = stage.offsetWidth;
        cards.forEach((card, i) => {
            /* find shortest circular distance from cur to i */
            let offset = i - cur;
            if (offset > total / 2) offset -= total;
            if (offset < -total / 2) offset += total;

            const cfg = slotCfg[String(offset)];

            if (!cfg) {
                card.style.opacity = '0';
                card.style.pointerEvents = 'none';
                card.style.zIndex = '0';
                return;
            }

            /* pick tilt: base tilt from tilts array + slot lean */
            const slotLean = offset * 2.5;
            const rot = tilts[i % tilts.length] + slotLean;

            card.style.opacity = cfg.o;
            card.style.zIndex = cfg.z;
            card.style.pointerEvents = offset === 0 ? 'none' : 'auto';
            card.style.boxShadow = offset === 0 ? '6px 6px 0 rgba(28,18,8,0.55)' : '3px 3px 0 rgba(28,18,8,0.3)';
            card.style.transform = `translateX(${cfg.x * w}px) scale(${cfg.s}) rotate(${rot}deg)`;
        });
    }

    function updateUI() {
        countEl.textContent = (cur + 1) + ' / ' + total;
        dotsWrap.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === cur));
    }

    function goTo(n) {
        if (animating) return;
        animating = true;
        cur = wrap(n);
        updateUI();
        layout();
        setTimeout(() => { animating = false; }, 520);
    }

    prevBtn.onclick = () => goTo(cur - 1);
    nextBtn.onclick = () => goTo(cur + 1);

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') goTo(cur - 1);
        if (e.key === 'ArrowRight') goTo(cur + 1);
    });

    let dragX = null;
    stage.addEventListener('pointerdown', e => { dragX = e.clientX; });
    window.addEventListener('pointerup', e => {
        if (dragX === null) return;
        const dx = e.clientX - dragX;
        dragX = null;
        if (Math.abs(dx) > 40) goTo(dx < 0 ? cur + 1 : cur - 1);
    });

    /* init */
    updateUI();
    layout();
    window.addEventListener('resize', layout);
</script>

    const projects = [
        {

            summary: 'A cozy concept art installation for a whimsical cafe environment.',
            description: 'A vibrant world-building concept project that showcases mood, lighting, and atmosphere through interior design and character-driven detail. This project explores playful shapes, warm palettes, and immersive storytelling through visual composition.',

                '/images/FoodCreatures/key_art_2 copy.webp'
            ],
           programs: ['photoshop']
        },
        {
           title: 'Homesick At Space Camp',
            thumbnail: '/images/ConceptArtA03/keyart_01_full.webp',
            summary: 'An atmospheric sci-fi landscape study with bold color and scale.',
            description: 'This piece investigates light, environment, and narrative tension in a cinematic setting. It combines dramatic silhouettes, sweeping vistas, and textural detail to establish a strong sense of place.',
            photos: [
                '/images/ConceptArtA03/keyart_01_full.webp',
                '/images/ConceptArtA03/keyart_02_full.webp',
                '/images/ConceptArtA03/gallery_03.webp',
                '/images/ConceptArtA03/gallery_02.webp'
            ],
           programs: ['photoshop']
        },
        {
           title: 'ROAM',
            thumbnail: '/images/ROAM/dino_roam_keyart_01.webp',
            summary: 'A dynamic game key art concept featuring a daring dinosaur chase.',
            description: 'A fast-paced visual exploration for a game concept, focusing on action, creature design, and atmospheric motion. The project emphasizes dramatic color contrast and bold compositions to heighten excitement.',
            photos: [
                '/images/ROAM/roam_gallery_01.webp',
                '/images/ROAM/roam_gallery_02.webp',
                '/images/ROAM/roam_gallery_03.webp'
            ],
           programs: ['photoshop', 'unity', 'blender']
        },
        {
           title: 'Ramen Hustle In Tomi City',
            thumbnail: '/images/RamenHustle/banner.webp',
            summary: 'A fast-paced ramen-serving game with a dark twist.',
            description: 'Character design and animation in a 2.5D visual style.',
            photos: [
                '/images/RamenHustle/concept_capybara.webp',
                '/images/RamenHustle/fox_concept.webp',
                '/images/RamenHustle/sc_1.webp',
                '/images/RamenHustle/gallery_boss.gif',
                '/images/RamenHustle/gallery_fox.gif',
                '/images/RamenHustle/gallery_hustle.gif',

            ],
           programs: ['photoshop', 'unity']
        },
        {
            title: 'Sleepy Fish Town',
            thumbnail: '/images/WorldBuilding/banner.webp',
            summary:'A futuristic cyberpunk world where sushi trucks are run by fish...?',
            description:'An exploration of a stylized Cyberpunk environment done in Unity.',
            photos: [
                '/images/WorldBuilding/gallery_01.webp',
                '/images/WorldBuilding/gallery_02.webp',
                '/images/WorldBuilding/gallery_03.webp',
                '/images/WorldBuilding/wip_keyart_01.webp',
                '/images/WorldBuilding/wip_keyart_02.webp',
                '/images/WorldBuilding/banner.webp',
                '/images/WorldBuilding/wip_sketch_01.webp',
                '/images/WorldBuilding/wip_sketch_02.webp',
                '/images/WorldBuilding/wip_sketch_03.webp',
            ],
            programs: ['unity','blender'],
        }


    ];

    const projectGrid = document.getElementById('projectGrid');
    const projectModal = document.getElementById('projectModal');
    const modalOverlay = document.getElementById('projectModalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalTitle = document.getElementById('projectModalTitle');
    const modalSummary = document.getElementById('projectModalSummary');
    const modalGallery = document.getElementById('projectModalGallery');
    const modalDetails = document.getElementById('projectModalDetails');

    function openProjectModal(index) {
        const project = projects[index];
        if (!project) return;

        modalTitle.textContent = project.title;
        modalSummary.textContent = project.summary;
        modalDetails.innerHTML = `
            <p>${project.description}</p>
            <div class="project-modal__tools">
                <h4>Programs Used</h4>
                <div class="tools-container">
                    ${project.programs.map(prog => `
                        <div class="tool-pill">
                            <img src="${programIcons[prog]}" alt="${prog}" class="tool-pill__icon">
                            <span>${prog.charAt(0).toUpperCase() + prog.slice(1)}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        modalGallery.innerHTML = project.photos.map((photo, photoIndex) => `
            <div class="project-modal__photo" data-photo-index="${photoIndex}" data-photo-src="${photo}">
                <img src="${photo}" alt="${project.title} photo">
            </div>
        `).join('');

        projectModal.classList.add('open');
        projectModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';

        // Add click handlers to photos for lightbox
        document.querySelectorAll('.project-modal__photo').forEach(photo => {
            photo.addEventListener('click', (e) => {
                const photoIndex = parseInt(e.currentTarget.dataset.photoIndex);
                openLightbox(project.photos, photoIndex);
            });
        });
    }

    function closeProjectModal() {
        projectModal.classList.remove('open');
        projectModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
    }

    // Lightbox functionality
    const projectLightbox = document.getElementById('projectLightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxOverlay = document.getElementById('projectLightboxOverlay');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    
    let currentLightboxPhotos = [];
    let currentLightboxIndex = 0;

    function openLightbox(photos, startIndex) {
        currentLightboxPhotos = photos;
        currentLightboxIndex = startIndex;
        lightboxImg.src = photos[startIndex];
        projectLightbox.classList.add('open');
        projectLightbox.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
        projectLightbox.classList.remove('open');
        projectLightbox.setAttribute('aria-hidden', 'true');
    }

    function showLightboxPhoto(index) {
        if (index < 0) {
            currentLightboxIndex = currentLightboxPhotos.length - 1;
        } else if (index >= currentLightboxPhotos.length) {
            currentLightboxIndex = 0;
        } else {
            currentLightboxIndex = index;
        }
        lightboxImg.src = currentLightboxPhotos[currentLightboxIndex];
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxOverlay.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', () => showLightboxPhoto(currentLightboxIndex - 1));
    lightboxNext.addEventListener('click', () => showLightboxPhoto(currentLightboxIndex + 1));

    document.addEventListener('keydown', (e) => {
        if (!projectLightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showLightboxPhoto(currentLightboxIndex - 1);
        if (e.key === 'ArrowRight') showLightboxPhoto(currentLightboxIndex + 1);
    });


    projects.forEach((project, index) => {
        const card = document.createElement('button');
        card.className = 'project-card';
        card.type = 'button';
        card.innerHTML = `
            <div class="project-card__thumb">
                <img src="${project.thumbnail}" alt="${project.title} thumbnail">
                <div class="project-card__badges">
                    ${project.programs.map(prog => `
                        <img src="${programIcons[prog]}" alt="${prog}" class="badge-icon" title="${prog}">
                    `).join('')}
                </div>
            </div>
            <div class="project-card__info">
                <span class="project-card__title">${project.title}</span>
                <span class="project-card__tag">${project.summary}</span>
            </div>
        `;
        card.addEventListener('click', () => openProjectModal(index));
        if (projectGrid) {
            projectGrid.appendChild(card);
        }
    });

    modalOverlay.addEventListener('click', closeProjectModal);
    modalClose.addEventListener('click', closeProjectModal);
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && projectModal.classList.contains('open')) {
            closeProjectModal();
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navToggle = document.querySelector('.nav-toggle');
        const siteNav = document.querySelector('.site-nav');
        if (!navToggle || !siteNav) return;

        navToggle.addEventListener('click', () => {
            const expanded = navToggle.getAttribute('aria-expanded') === 'true';
            navToggle.setAttribute('aria-expanded', String(!expanded));
            navToggle.classList.toggle('open');
            siteNav.classList.toggle('open');
        });

        document.addEventListener('click', (event) => {
            if (!siteNav.classList.contains('open')) return;
            if (siteNav.contains(event.target) || navToggle.contains(event.target)) return;
            siteNav.classList.remove('open');
            navToggle.setAttribute('aria-expanded', 'false');
        });
    });
</script>
