<script>
    filterSelection("all")
    function filterSelection(c) {
        var x, i;
        x = document.getElementsByClassName("filterDiv");
        if (c == "all") c = "";
        for (i = 0; i < x.length; i++) {
            w3RemoveClass(x[i], "show");
            if (x[i].className.indexOf(c) > -1) w3AddClass(x[i], "show");
        }
    }

    function w3AddClass(element, name) {
        var i, arr1, arr2;
        arr1 = element.className.split(" ");
        arr2 = name.split(" ");
        for (i = 0; i < arr2.length; i++) {
            if (arr1.indexOf(arr2[i]) == -1) { element.className += " " + arr2[i]; }
        }
    }

    function w3RemoveClass(element, name) {
        var i, arr1, arr2;
        arr1 = element.className.split(" ");
        arr2 = name.split(" ");
        for (i = 0; i < arr2.length; i++) {
            while (arr1.indexOf(arr2[i]) > -1) {
                arr1.splice(arr1.indexOf(arr2[i]), 1);
            }
        }
        element.className = arr1.join(" ");
    }

    // Add active class to the current button (highlight it)
    var btnContainer = document.getElementById("btncontainer");
    var btns = btnContainer.getElementsByClassName("btn");
    for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function () {
            var current = document.getElementsByClassName("active");
            current[0].className = current[0].className.replace(" active", "");
            this.className += " active";
        });
    }
</script>

<!-- Modal Functionality Script -->
<script>
    function openModal(id, event) {
        const project = event.currentTarget;
        const img = project.querySelector('img');
        const rect = img.getBoundingClientRect();

        const morphDuration = 200;
        const fadeDelay = 500;
        const fadeDuration = 1000;

        const overlay = document.getElementById('morph-overlay');
        const overlayImg = document.getElementById('morph-overlay-img');
        const modal = document.getElementById(id);
        const modalContent = modal.querySelector('.modal-content');

        // Morph overlay logic (unchanged)
        overlayImg.src = img.src;
        overlay.style.display = 'block';
        overlay.style.left = rect.left + 'px';
        overlay.style.top = rect.top + 'px';
        overlay.style.width = rect.width + 'px';
        overlay.style.height = rect.height + 'px';
        overlay.style.backgroundColor = '#202024';
        overlay.style.opacity = '1';

        // Show modal, reset opacity and transition
        modal.style.display = 'flex';
        modal.scrollTop = 0;
        modal.style.opacity = '1';
        modal.style.transition = '';
        modalContent.classList.remove('visible');

        void overlay.offsetWidth; // force reflow

        setTimeout(() => {
            const modalRect = modalContent.getBoundingClientRect();
            const padding = 16;
            const visibleTop = Math.max(modalRect.top + padding, 0);
            const visibleBottom = Math.min(modalRect.bottom - padding, window.innerHeight);
            const visibleHeight = visibleBottom - visibleTop;
            overlay.style.left = modalRect.left + 'px';
            overlay.style.top = visibleTop + 'px';
            overlay.style.width = modalRect.width + 'px';
            overlay.style.height = visibleHeight + 'px';
            overlay.style.borderRadius = '12px';
        }, morphDuration);

        setTimeout(() => {
            overlay.style.opacity = '0';
            modalContent.classList.add('visible');
        }, fadeDelay);

        setTimeout(() => {
            overlay.style.display = 'none';
            overlayImg.style.opacity = '1';
        }, fadeDelay + fadeDuration);

        // Attach click-outside handler only once
        function handleClickOutside(e) {
            if (e.target === modal) {
                closeModal(id);
            }
        }
        modal._handleClickOutside = handleClickOutside;
        modal.addEventListener('click', handleClickOutside);
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        const modalContent = modal.querySelector('.modal-content');

        // Fade out modal-content
        modalContent.classList.remove('visible');

        // Remove click-outside handler
        if (modal._handleClickOutside) {
            modal.removeEventListener('click', modal._handleClickOutside);
            delete modal._handleClickOutside;
        }

        // After fade, hide modal container
        setTimeout(() => {
            modal.style.display = 'none';
        }, 100); // match the CSS transition duration
    }
</script>

<!-- Auto-open modal based on URL parameter -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Check if the URL contains ?openModal=modalName
        const params = new URLSearchParams(window.location.search);
        const modalToOpen = params.get("openModal");

        if (modalToOpen) {
            // Wait a brief moment to ensure layout is ready
            setTimeout(() => {
                const fakeEvent = { currentTarget: document.querySelector(`[onclick*="${modalToOpen}"]`) };
                openModal(modalToOpen, fakeEvent);
            }, 300);
        }
    });
</script>

<!-- Lightbox Functionality Script -->
<script>
    const layout = document.querySelector('.lightbox-layout');
    const lightbox = document.getElementById('lightbox');
    const stack = document.getElementById('lightbox-stack');
    const sidePanel = document.getElementById('lightbox-side');
    const closeBtn = document.getElementById('lightbox-close');
    const zoomables = document.querySelectorAll('.zoomable');

    // Open lightbox function
    function openLightbox() {
        lightbox.style.display = 'block';
        void lightbox.offsetWidth; // force reflow
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden'; // lock page scroll
    }

    // Close lightbox function
    function closeLightbox() {
        lightbox.classList.remove('show');
        setTimeout(() => {
            lightbox.style.display = 'none';
            stack.innerHTML = '';
            sidePanel.innerHTML = '';
            document.body.style.overflow = ''; // restore page scroll
            layout.classList.remove('no-side');
        }, 400); // match fade-out transition
    }

    // Open lightbox on click
    zoomables.forEach(img => {
        img.addEventListener('click', () => {
            stack.innerHTML = '';
            sidePanel.innerHTML = '';

            // Main image
            const mainImg = document.createElement('img');
            mainImg.src = img.src;
            stack.appendChild(mainImg);

            // Optional caption
            if (img.dataset.caption) {
                const caption = document.createElement('p');
                caption.className = 'lightbox-caption';
                caption.textContent = img.dataset.caption;
                stack.appendChild(caption);
            }

            // WIP images
            if (img.dataset.gallery) {
                img.dataset.gallery.split(',').forEach(src => {
                    const extraImg = document.createElement('img');
                    extraImg.src = src.trim();
                    stack.appendChild(extraImg);
                });
            }

            // Side panel logic
            if (img.dataset.side && img.dataset.side.trim() !== '') {
                sidePanel.innerHTML = img.dataset.side;
                sidePanel.style.display = '';
                layout.classList.remove('no-side');
                stack.classList.remove('no-side');
            } else {
                sidePanel.innerHTML = '';
                sidePanel.style.display = 'none';
                layout.classList.add('no-side');
                stack.classList.add('no-side');
            }

            openLightbox();
        });
    });

    // Close on background click
    lightbox.addEventListener('click', (e) => {
        if (!layout.contains(e.target)) closeLightbox();
    });

    // Close on X button click
    closeBtn.addEventListener('click', closeLightbox);

    // Close on ESC key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.style.display === 'block') {
            closeLightbox();
        }
    });
</script>



<!-- fade section script v2-->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sections = document.querySelectorAll(".fade-section");

        // Pick a threshold based on screen width
        function getThreshold() {
            if (window.innerWidth < 600) return 0.1;   // phones
            if (window.innerWidth < 1024) return 0.2;  // tablets
            return 0.5;                                // desktops
        }

        let observer = createObserver();

        function createObserver() {
            return new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: getThreshold() });
        }

        // Observe all sections
        sections.forEach(section => observer.observe(section));

        // Optional: Re-create observer on resize
        window.addEventListener("resize", () => {
            const newThreshold = getThreshold();

            // Rebuild observer only if threshold changed
            if (observer.threshold !== newThreshold) {
                observer.disconnect();
                observer = createObserver();
                sections.forEach(section => {
                    if (!section.classList.contains("visible")) {
                        observer.observe(section);
                    }
                });
            }
        });
    });
</script>
